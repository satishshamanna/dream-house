<template>
    <lightning-card title="VIP Buyer Matches" icon-name="standard:contact">
        <template lwc:if={loading}>
            <div class="slds-align_absolute-center slds-p-around_medium">
                <lightning-spinner alternative-text="Loading matches" size="small"></lightning-spinner>
            </div>
        </template>
        <template lwc:if={error}>
            <div class="slds-p-around_medium slds-text-color_error">
                {errorMessage}
            </div>
        </template>
        <template lwc:if={hasRecords}>
            <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                <thead>
                    <tr class="slds-line-height_reset">
                        <th scope="col">
                            <div class="slds-truncate" title="Name">Name</div>
                        </th>
                        <th scope="col">
                            <div class="slds-truncate" title="Email">Email</div>
                        </th>
                        <th scope="col">
                            <div class="slds-truncate" title="Budget">Budget</div>
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={buyers} for:item="buyer">
                        <tr key={buyer.Id} class="slds-hint-parent">
                            <td>
                                <div class="slds-truncate" title={buyer.Name}>{buyer.Name}</div>
                            </td>
                            <td>
                                <div class="slds-truncate">
                                    <a href={buyer.MailtoHref}>{buyer.Email}</a>
                                </div>
                            </td>
                            <td>
                                <div class="slds-truncate">
                                    <lightning-formatted-number value={buyer.Budget__c} format-style="currency" currency-code="USD" maximum-fraction-digits="0"></lightning-formatted-number>
                                </div>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </template>
        <template lwc:if={noRecordsFound}>
            <div class="slds-p-around_medium slds-text-align_center slds-text-color_weak">
                No matching VIP buyers found.
            </div>
        </template>
    </lightning-card>
</template>
